[package]
name = "robo-trading"
version = "0.1.0"
edition = "2021"

[lib]
name = "robo_trading"
path = "src/lib.rs"

[[bin]]
name = "robo-trading"
path = "src/main.rs"

[[bin]]
name = "interactive"
path = "src/bin/interactive.rs"
authors = ["Quant Trader <trader@example.com>"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
hyper = { version = "1.1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Crypto and API
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Configuration
dotenv = "0.15"
config = "0.14"

# Technical Analysis
ta = "0.5"

# Statistics and Math
statrs = "0.16"
ndarray = "0.15"
rand = "0.8"
rand_distr = "0.4"

# Database (optional for storing trades)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"], optional = true }

# Performance
dashmap = "5.5"
parking_lot = "0.12"

# Utilities
futures = "0.3"
async-trait = "0.1"
once_cell = "1.19"

[dev-dependencies]
mockito = "1.2"
tokio-test = "0.4"

[features]
default = ["backtest"]
backtest = []
database = ["sqlx"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
